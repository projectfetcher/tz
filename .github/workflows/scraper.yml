name: ZoomTanzania scraper

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 lxml
      - run: python tz.py
      - uses: actions/upload-artifact@v4
        with:
          name: zoom-output
          path: |
            zoom_jobs.csv
            zoom_jobs.json
            zoom_seen.txt
