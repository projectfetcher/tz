name: Scraper
on:
  schedule:
    - cron: '29 2 * * *'
  workflow_dispatch:
    inputs:
      sources:
        description: 'Sources to run (zoom,gtj,jwt,linkedin). Empty = all four'
        required: false
        default: ''
concurrency:
  group: tz-scraper
  cancel-in-progress: false
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml openpyxl
      - name: Restore tracker
        uses: actions/cache@v4
        with:
          path: |
            scraped_seen.txt
            scraped_jobs.csv
          key: tz-tracker-${{ github.run_id }}
          restore-keys: |
            tz-tracker-
      - name: Run scraper
        env:
          WP_BASE_URL:      ${{ secrets.WP_BASE_URL }}
          INTERNAL_BOT_KEY: ${{ secrets.INTERNAL_BOT_KEY }}
          WP_USERNAME:      ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD:  ${{ secrets.WP_APP_PASSWORD }}
          SOURCES:          ${{ github.event.inputs.sources }}
        run: python tz.py
      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tz-jobs-output
          path: |
            scraped_jobs.xlsx
            scraped_jobs.csv
            scraped_jobs.json
            scraped_seen.txt
          if-no-files-found: ignore
